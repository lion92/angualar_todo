                                                                                                                                                
  name: Build & Test                                        

  on:
    push:
      branches: [ main, dev ]

  jobs:
    build:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: todolist

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: 20

        - run: npm install

        - run: npm run build

        - run: npm test -- --watch=false
