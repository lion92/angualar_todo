<div class="flex items-center gap-3 px-4 py-3 bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition group">

  <!-- Checkbox -->
  <button
    (click)="toggleCompleted()"
    class="flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-200"
    [class]="todo.completed
      ? 'bg-emerald-500 border-emerald-500 shadow-sm'
      : 'border-gray-300 hover:border-blue-400'"
    title="Toggle completed"
  >
    @if (todo.completed) {
      <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
      </svg>
    }
  </button>

  <!-- Title / Edit input -->
  @if (!editMode) {
    <span
      class="flex-1 font-medium transition-all duration-200"
      [class]="todo.completed ? 'line-through text-gray-400' : 'text-gray-700'"
    >
      {{ todo.title }}
    </span>
  } @else {
    <input
      type="text"
      [(ngModel)]="editTitle"
      (keyup.enter)="confirmUpdate()"
      (keyup.escape)="cancelEdit()"
      class="flex-1 px-3 py-1 rounded-lg border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-700 text-sm"
    />
  }

  <!-- Action buttons -->
  <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-150">

    @if (!editMode) {
      <!-- Edit -->
      <button
        (click)="startEdit()"
        class="p-1.5 rounded-lg text-gray-400 hover:text-blue-500 hover:bg-blue-50 transition"
        title="Edit"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
               m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </button>
    } @else {
      <!-- Save -->
      <button
        (click)="confirmUpdate()"
        class="px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-500 text-white hover:bg-blue-600 transition"
      >
        Save
      </button>
      <!-- Cancel -->
      <button
        (click)="cancelEdit()"
        class="px-2.5 py-1 rounded-lg text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition"
      >
        Cancel
      </button>
    }

    <!-- Delete -->
    <button
      (click)="delete.emit(todo.id)"
      class="p-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 transition"
      title="Delete"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7
             m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    </button>

  </div>

</div>
