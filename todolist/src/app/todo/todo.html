<div class="container">

  <input
    type="text"
    [ngModel]="newTodo()"
    (ngModelChange)="newTodo.set($event)"
    placeholder="Add a new todo"
  />
  <button (click)="addTodo()">Add</button>

  @for (item of todos(); track item.id) {
    <app-todo-item
      [todo]="item"
      (delete)="delete($event)"
      (update)="update($event)">
    </app-todo-item>
  }

</div>
